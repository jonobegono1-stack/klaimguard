<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KlaimGuard — Cek Rekap &amp; Koding Klaim</title>
<style>
  :root{
    --bg:#f4f6f8; --card:#ffffff; --ink:#1a1d21; --muted:#5b6470; --line:#e2e6ea;
    --merah:#d92d20; --kuning:#d97706; --hijau:#12805c; --aksen:#0b6bcb;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:12px}
  header h1{font-size:17px;margin:0;font-weight:700}
  header .ver{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 9px}
  main{max-width:1180px;margin:0 auto;padding:20px 22px 60px}
  .drop{border:2px dashed #c3ccd6;border-radius:12px;background:var(--card);padding:38px 20px;text-align:center;cursor:pointer;transition:.15s}
  .drop:hover,.drop.over{border-color:var(--aksen);background:#f0f7ff}
  .drop .big{font-size:15px;font-weight:600}
  .drop .sub{color:var(--muted);font-size:12.5px;margin-top:4px}
  .status{margin-top:12px;font-size:12.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .badge{display:inline-block;border-radius:6px;padding:1px 8px;font-size:11.5px;font-weight:600}
  .badge.rekap{background:#eaf1fb;color:#18508f}.badge.mix{background:#eef4ec;color:#2e6b37}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .card .n{font-size:24px;font-weight:750;line-height:1.1}
  .card .l{font-size:12px;color:var(--muted);margin-top:2px}
  .card.m .n{color:var(--merah)}.card.k .n{color:var(--kuning)}.card.h .n{color:var(--hijau)}
  .checks{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
  .chip{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:3px 11px;color:var(--muted);background:var(--card)}
  .chip b{color:var(--ink)}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
  .seg button{border:0;background:transparent;padding:7px 14px;font-size:13px;cursor:pointer;color:var(--muted)}
  .seg button.on{background:var(--aksen);color:#fff}
  input.search{flex:1;min-width:180px;border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px}
  .btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 14px;font-size:13px;cursor:pointer}
  .btn.primary{background:var(--aksen);border-color:var(--aksen);color:#fff}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:12.5px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{background:#f7f9fa;font-size:11.5px;color:var(--muted);position:sticky;top:0}
  tr.m td:first-child{border-left:3px solid var(--merah)}
  tr.k td:first-child{border-left:3px solid var(--kuning)}
  tr.h td:first-child{border-left:3px solid var(--hijau)}
  tr.m{background:#fff7f6} tr.k{background:#fffbf2}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 6px;margin:1px 2px 1px 0}
  .tag.merah{background:#ffe4e2;color:var(--merah)}.tag.kuning{background:#fff1d6;color:var(--kuning)}
  .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11.5px}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .foot{margin-top:14px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>KlaimGuard</h1>
  <span class="ver">v0.1</span>
  <span style="color:var(--muted);font-size:12.5px">Cek rekap &amp; koding klaim — jalan lokal, data tidak keluar dari komputer ini</span>
</header>
<main>
  <div class="drop" id="drop">
    <div class="big">Tarik file rekap klaim / ekspor MIX ke sini</div>
    <div class="sub">atau klik untuk pilih file — mendukung .xlsx (rekap bulanan) dan .txt (ekspor INA-CBG MIX)</div>
  </div>
  <input type="file" id="file" accept=".xlsx,.xls,.txt,.csv" hidden>
  <div class="status" id="status" hidden></div>

  <div class="cards" id="cards" hidden></div>
  <div class="checks" id="checks" hidden></div>
  <div class="controls" id="controls" hidden>
    <div class="seg" id="seg">
      <button data-f="semua" class="on">Semua</button>
      <button data-f="merah">Merah</button>
      <button data-f="kuning">Kuning</button>
      <button data-f="hijau">Hijau</button>
    </div>
    <input class="search" id="q" placeholder="Cari SEP / RM / nama / kode / diagnosa…">
    <button class="btn primary" id="csv">Export CSV</button>
  </div>
  <div id="tbl"></div>
  <div class="foot" id="foot" hidden></div>
</main>

<script src="lib/xlsx.full.min.js"></script>
<script src="klaimguard-core.js"></script>
<script>
(function(){
  const $ = s => document.querySelector(s);
  const drop=$("#drop"), file=$("#file"), status=$("#status"), cards=$("#cards"),
        checks=$("#checks"), controls=$("#controls"), seg=$("#seg"), q=$("#q"),
        tbl=$("#tbl"), csvBtn=$("#csv"), foot=$("#foot");

  let state = null; // {format, results, summary, judul, header, filename}
  let filter = "semua";

  drop.addEventListener("click", () => file.click());
  drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", e => {
    e.preventDefault(); drop.classList.remove("over");
    if (e.dataTransfer.files.length) baca(e.dataTransfer.files[0]);
  });
  file.addEventListener("change", () => { if (file.files.length) baca(file.files[0]); file.value=""; });

  function baca(f){
    const nama = f.name.toLowerCase();
    if (nama.endsWith(".txt")){
      const r = new FileReader();
      r.onload = () => tampil(KG.proses(r.result, f.name), f.name);
      r.readAsText(f);
    } else {
      const r = new FileReader();
      r.onload = () => {
        try {
          const wb = XLSX.read(new Uint8Array(r.result), {type:"array"});
          const ws = wb.Sheets[wb.SheetNames[0]];
          const aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:null});
          tampil(KG.proses(aoa, f.name), f.name);
        } catch(err){ alert("Gagal baca file: " + err.message); }
      };
      r.readAsArrayBuffer(f);
    }
  }

  function tampil(res, filename){
    if (res.error){ alert(res.error); return; }
    state = res; state.filename = filename;
    filter = "semua";
    seg.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.f==="semua"));
    q.value="";

    status.hidden = false;
    status.innerHTML = "<b>" + filename + "</b>"
      + " <span class='badge " + res.format + "'>" + (res.format==="rekap"?"REKAP BULANAN":"EKSpor MIX") + "</span>"
      + " <span>" + res.count.toLocaleString("id-ID") + " klaim terbaca</span>"
      + (res.judul && res.judul[0] ? " <span style='opacity:.7'>• " + res.judul[0] + "</span>" : "");

    const s = res.summary;
    cards.hidden = false;
    cards.innerHTML =
      card("Total klaim", s.total.toLocaleString("id-ID"), "") +
      card("Rawat jalan", s.rajal.toLocaleString("id-ID"), "") +
      card("Rawat inap", s.ranap.toLocaleString("id-ID"), "") +
      card("Perlu cek (merah)", s.merah.toLocaleString("id-ID"), "m") +
      card("Perlu cek (kuning)", s.kuning.toLocaleString("id-ID"), "k") +
      card("Aman", s.hijau.toLocaleString("id-ID"), "h");

    const labelCek = {dup:"SEP kosong/duplikat", tgl:"Tanggal anomali", tglkosong:"Tanggal kosong",
      inacbg:"Kode INACBG bermasalah", kelas:"Kelas vs jenis", nilai:"Nilai ≤ 0", topup:"Ada top-up",
      gagal:"Gagal grouping iDRG", satuDx:"Hanya 1 diagnosis", dx9:"Diagnosa utama .9",
      sex:"Kode obstetri di laki-laki", umur:"Kode neonatal usia>1"};
    const ck = [];
    for (const [k,v] of Object.entries(s.checks)) if (v>0) ck.push("<span class='chip'>" + (labelCek[k]||k) + " <b>" + v + "</b></span>");
    checks.hidden = ck.length === 0;
    checks.innerHTML = ck.length ? "<b style='font-size:12px'>Temuan per aturan:</b> " + ck.join("") : "";

    controls.hidden = false;
    render();
  }

  function card(l, n, cls){ return "<div class='card " + cls + "'><div class='n'>" + n + "</div><div class='l'>" + l + "</div></div>"; }

  function render(){
    if (!state) return;
    const qv = q.value.toLowerCase();
    const rows = state.results.filter(r => {
      if (filter!=="semua" && r.level!==filter) return false;
      if (qv){
        const hay = (r.sep+" "+r.rm+" "+r.nama+" "+r.inacbg+" "+(r.diag||"")+" "+(r.deskripsi||"")).toLowerCase();
        if (!hay.includes(qv)) return false;
      }
      return true;
    });
    if (state.format === "rekap") renderRekap(rows);
    else renderMix(rows);
    foot.hidden = false;
    foot.textContent = "Menampilkan " + rows.length.toLocaleString("id-ID") + " dari " + state.results.length.toLocaleString("id-ID") + " klaim.";
  }

  function tags(ms){ return ms.map(m => "<span class='tag " + m.level + "'>" + esc(m.label) + "</span>").join(""); }

  function renderRekap(rows){
    let h = "<table><thead><tr><th>No</th><th>No SEP</th><th>Jns</th><th>Nama</th><th>No RM</th><th>INACBG</th><th>Masuk</th><th>Pulang</th><th>Top-up</th><th>Nilai</th><th>Tarif RS</th><th>Temuan</th></tr></thead><tbody>";
    if (!rows.length) h += "<tr><td colspan=12 class='empty'>Tidak ada baris.</td></tr>";
    for (const r of rows){
      h += "<tr class='" + r.level + "'><td>" + r.no + "</td><td class='mono'>" + esc(r.sep) + "</td><td>" + esc(r.jenis) + "</td><td>" + esc(r.nama) + "</td><td class='mono'>" + esc(r.rm) + "</td><td class='mono'>" + esc(r.inacbg) + "</td><td>" + r.masuk + "</td><td>" + r.pulang + "</td><td>" + esc(r.topup) + "</td><td>" + fmtRp(r.total) + "</td><td>" + fmtRp(r.tarif_rs) + "</td><td>" + tags(r.masalah) + "</td></tr>";
    }
    tbl.innerHTML = h + "</tbody></table>";
  }

  function renderMix(rows){
    let h = "<table><thead><tr><th>No SEP</th><th>Jns</th><th>Nama</th><th>No RM</th><th>INACBG</th><th>Deskripsi</th><th>Diagnosa</th><th>Tindakan</th><th>CW</th><th>LOS</th><th>Temuan</th></tr></thead><tbody>";
    if (!rows.length) h += "<tr><td colspan=11 class='empty'>Tidak ada baris.</td></tr>";
    for (const r of rows){
      h += "<tr class='" + r.level + "'><td class='mono'>" + esc(r.sep) + "</td><td>" + esc(r.jenis) + "</td><td>" + esc(r.nama) + "</td><td class='mono'>" + esc(r.rm) + "</td><td class='mono'>" + esc(r.inacbg) + "</td><td>" + esc(r.deskripsi) + "</td><td class='mono'>" + esc(r.diag) + "</td><td class='mono'>" + esc(r.proc) + "</td><td>" + esc(r.cw) + "</td><td>" + r.los + "</td><td>" + tags(r.masalah) + "</td></tr>";
    }
    tbl.innerHTML = h + "</tbody></table>";
  }

  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
  function fmtRp(n){ return "Rp " + Math.round(n).toLocaleString("id-ID"); }

  seg.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    filter = b.dataset.f;
    seg.querySelectorAll("button").forEach(x => x.classList.toggle("on", x===b));
    render();
  });
  q.addEventListener("input", render);

  csvBtn.addEventListener("click", () => {
    if (!state) return;
    const cols = state.format==="rekap"
      ? ["No","No SEP","Jenis","Nama","No RM","INACBG","Masuk","Pulang","Top-up","Nilai","Tarif RS","Level","Temuan"]
      : ["No SEP","Jenis","Nama","No RM","INACBG","Deskripsi","Diagnosa","Tindakan","CW","LOS","Level","Temuan"];
    const lines = [cols.join(";")];
    for (const r of state.results){
      const v = state.format==="rekap"
        ? [r.no,r.sep,r.jenis,r.nama,r.rm,r.inacbg,r.masuk,r.pulang,r.topup,r.total,r.tarif_rs,r.level,r.masalah.map(m=>m.label).join(" | ")]
        : [r.sep,r.jenis,r.nama,r.rm,r.inacbg,r.deskripsi,r.diag,r.proc,r.cw,r.los,r.level,r.masalah.map(m=>m.label).join(" | ")];
      lines.push(v.map(x => '"' + String(x==null?"":x).replace(/"/g,'""') + '"').join(";"));
    }
    const blob = new Blob(["\uFEFF" + lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "klaimguard_" + (state.filename||"hasil").replace(/\.(xlsx|txt|csv)$/i,"") + "_cek.csv";
    a.click();
  });
})();
</script>
</body>
</html>
